name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Dotnet diagnostics
        run: |
          dotnet --info
          dotnet --list-sdks
          ls -la
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - run: dotnet list package --vulnerable || true
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/smartbank-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/smartbank-web/package-lock.json
      - name: Frontend diagnostics
        run: |
          node --version
          npm --version
          npm config get registry
          ls -la
          npm ls --package-lock-only 2>&1 | tail -5 || true
      - run: npm ci --no-audit --no-fund
      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: ~/.npm/_logs/
          if-no-files-found: ignore
      - run: npm test
      - run: npx ng build --configuration=production
      - run: npm audit --omit=dev || true

  e2e:
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/smartbank-web/package-lock.json
      - name: E2E diagnostics
        run: |
          dotnet --info
          node --version
          npm --version
          docker --version
          ls -la
      - run: docker compose up -d
      - run: dotnet test -c Release --logger "trx;LogFileName=test-results.trx"
      - working-directory: frontend/smartbank-web
        run: npx playwright install chromium && npx playwright test
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color > docker-compose.log 2>&1 || true
      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            docker-compose.log
            frontend/smartbank-web/test-results/
            frontend/smartbank-web/playwright-report/
            **/TestResults/**
          if-no-files-found: ignore
