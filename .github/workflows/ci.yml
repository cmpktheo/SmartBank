name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Dotnet diagnostics
        run: |
          dotnet --info
          dotnet --list-sdks
          ls -la
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - run: dotnet list package --vulnerable || true
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/smartbank-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/smartbank-web/package-lock.json
      - name: Frontend diagnostics
        run: |
          node --version
          npm --version
          npm config get registry
          ls -la
          npm ls --package-lock-only 2>&1 | tail -5 || true
      - run: npm ci --no-audit --no-fund
      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: ~/.npm/_logs/
          if-no-files-found: ignore
      - run: npm test
      - run: npx ng build --configuration=production
      - run: npm audit --omit=dev || true

  e2e:
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/smartbank-web/package-lock.json
      - name: E2E diagnostics
        run: |
          dotnet --info
          node --version
          npm --version
          docker --version
          ls -la
      - name: Start infrastructure
        run: docker compose up -d --wait --wait-timeout 180
      - run: dotnet test -c Release --logger "trx;LogFileName=test-results.trx"
      - name: Start backend APIs
        run: |
          mkdir -p .logs
          export ASPNETCORE_ENVIRONMENT=Development
          export E2E_OTP_SEAM=true
          dotnet run --project src/Services/Identity/SmartBank.Identity.Api/SmartBank.Identity.Api.csproj -c Release --no-build --no-launch-profile > .logs/apis-identity.log 2>&1 &
          dotnet run --project src/Services/Customer/SmartBank.Customer.Api/SmartBank.Customer.Api.csproj -c Release --no-build --no-launch-profile > .logs/apis-customer.log 2>&1 &
          dotnet run --project src/Services/Ledger/SmartBank.Ledger.Api/SmartBank.Ledger.Api.csproj -c Release --no-build --no-launch-profile > .logs/apis-ledger.log 2>&1 &
          dotnet run --project src/Services/Cards/SmartBank.Cards.Api/SmartBank.Cards.Api.csproj -c Release --no-build --no-launch-profile > .logs/apis-cards.log 2>&1 &
          dotnet run --project src/Services/Notification/SmartBank.Notification.Api/SmartBank.Notification.Api.csproj -c Release --no-build --no-launch-profile > .logs/apis-notification.log 2>&1 &
          dotnet run --project src/Gateways/SmartBank.ApiGateway/SmartBank.ApiGateway.csproj -c Release --no-build --no-launch-profile > .logs/apis-gateway.log 2>&1 &
          for port in 5100 5101 5102 5103 5104 5105; do
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:$port/health/ready" > /dev/null; then echo "port $port ready"; break; fi
              if [ "$i" -eq 60 ]; then echo "port $port NOT ready"; exit 1; fi
              sleep 2
            done
          done
      - name: Install frontend dependencies
        working-directory: frontend/smartbank-web
        run: npm ci --no-audit --no-fund
      - name: Install Playwright chromium
        working-directory: frontend/smartbank-web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: frontend/smartbank-web
        run: npx playwright test
      - name: Dump backend logs on failure
        if: failure()
        run: |
          docker compose logs --no-color > docker-compose.log 2>&1 || true
          tail -100 .logs/apis-*.log || true
      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            docker-compose.log
            .logs/apis-*.log
            frontend/smartbank-web/test-results/
            frontend/smartbank-web/playwright-report/
            **/TestResults/**
          if-no-files-found: ignore
