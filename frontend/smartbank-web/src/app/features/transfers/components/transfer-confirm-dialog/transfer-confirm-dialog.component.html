<div class="sb-modal-backdrop" (click)="cancel.emit()">
  <div
    data-testid="transfer-confirm-modal"
    role="dialog"
    aria-modal="true"
    class="sb-modal card"
    (click)="$event.stopPropagation()"
  >
    <h3 class="text-[18px] text-white mb-1">Confirm transfer</h3>
    <p class="muted text-[12px] mb-4">Idempotency-protected booking</p>
    <div class="sb-confirm-box">
      <div class="row-between">
        <span class="muted">From</span
        ><strong data-testid="transfer-confirm-from" class="text-white">{{ from() }}</strong>
      </div>
      <div class="row-between">
        <span class="muted">To</span
        ><span data-testid="transfer-confirm-to" class="mono text-white">{{ to() }}</span>
      </div>
      <div class="row-between">
        <span class="muted">Amount</span
        ><strong data-testid="transfer-confirm-amount" class="tnum text-white"
          >{{ amount() }} {{ currency() }}</strong
        >
      </div>
      <div class="row-between">
        <span class="muted">Type</span><span class="text-white">{{ transferType() }}</span>
      </div>
    </div>
    <div class="flex gap-2.5 mt-4">
      <button data-testid="transfer-cancel-btn" class="btn-secondary flex-1" (click)="cancel.emit()">
        Cancel
      </button>
      <button
        data-testid="transfer-confirm-btn"
        class="btn-primary flex-1"
        (click)="confirm.emit()"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'Booking…' : 'Confirm' }}
      </button>
    </div>
  </div>
</div>
