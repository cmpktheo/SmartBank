global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          origin: smartbank-otel
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  # NOTE: no per-service health scrape here. /health/ready returns plain-text
  # "Healthy", not Prometheus exposition format, so a metrics scrape of it can
  # never succeed (it only produced perpetual "down" targets + parse errors).
  # Service liveness is already visible via OTel series presence ("Services
  # reporting" panels) and the /health/ready endpoints directly.
