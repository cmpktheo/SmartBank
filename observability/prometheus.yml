global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          origin: smartbank-otel
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: smartbank-health
    metrics_path: /health/ready
    scheme: http
    static_configs:
      - targets:
          - 'host.docker.internal:5100'
          - 'host.docker.internal:5101'
          - 'host.docker.internal:5102'
          - 'host.docker.internal:5103'
          - 'host.docker.internal:5104'
          - 'host.docker.internal:5105'
        labels:
          origin: health-probe
