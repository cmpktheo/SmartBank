server:
  http_listen_port: 3200
  # Must NOT be 4317: the distributor's OTLP gRPC receiver already binds 4317.
  # (4317 here crashed Tempo with "bind: address already in use".)
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        # Bind all interfaces: the collector dials tempo:4317/4318 from
        # another container. (Defaults bind loopback, which the collector
        # cannot reach -> "connection refused", traces dropped.)
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    pool:
      max_workers: 4
      queue_depth: 100

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
